<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remis particular - RemisCL</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/particular.css">
  <link rel="stylesheet" href="../css/tema-oscuro.css">
</head>
<body class="pagina-particular">

  <div class="app-container">
    <header class="particular-header">
      <nav class="particular-nav" aria-label="Navegación principal">
        <a href="inicio.html" class="btn btn-secondary">Inicio</a>
        <a href="mis-reservas.html" class="btn btn-primary">Mis reservas</a>
      </nav>
      <div class="particular-heading">
        <p class="eyebrow">RemisCL</p>
        <h1>Viaje particular</h1>
        <p class="subtitle">Pedí un vehículo exclusivo a tu disposición.</p>
      </div>
    </header>

    <main>
      <div class="banner-info">
        <p><strong>Servicio exclusivo</strong> El coche viaja solo con vos y tus acompañantes, directo a destino y con horarios a tu medida.</p>
      </div>

      <section aria-labelledby="titulo-solicitud">
        <div class="section-heading">
          <p class="section-kicker">Nueva solicitud</p>
          <h2 id="titulo-solicitud">¿A dónde querés viajar?</h2>
        </div>

        <form id="form-particular">
          <div class="form-grid">
            <div class="form-group">
              <label for="origen">Origen</label>
              <div class="origen-control">
                <input type="text" id="origen" placeholder="Ej: Campo Largo, Barrio Centro" required>
                <button type="button" id="btn-ubicacion" class="btn btn-secondary">Agregar GPS</button>
              </div>
              <p id="mensaje-ubicacion" class="mensaje-ubicacion" aria-live="polite"></p>
            </div>

            <div class="form-group">
              <label for="destino">Destino final</label>
              <input type="text" id="destino" placeholder="Ej: Sáenz Peña, Resistencia" required>
            </div>

            <div class="form-group">
              <label for="fecha">Fecha del viaje</label>
              <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
              <label for="hora">Hora de salida</label>
              <input type="time" id="hora" required>
            </div>

            <div class="form-group form-group-wide">
              <label for="pasajeros">Pasajeros</label>
              <select id="pasajeros">
                <option value="1">1 pasajero</option>
                <option value="2">2 pasajeros</option>
                <option value="3">3 pasajeros</option>
                <option value="4">4 pasajeros</option>
              </select>
            </div>

            <div class="form-group form-group-wide">
              <label for="observaciones">Observaciones o pedidos especiales</label>
              <input type="text" id="observaciones" placeholder="Ej: baúl cargado o varias paradas">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-solicitar" class="btn btn-primary accion-privada btn-accion">Solicitar viaje</button>
            <a href="mis-reservas.html" class="btn btn-secondary">Ir a mis reservas</a>
          </div>
        </form>
        <p id="mensaje-confirmacion" class="mensaje-confirmacion" aria-live="polite"></p>
      </section>
    </main>

  </div>

  <script type="module" src="../js/particular.js"></script>
  <script src="../js/tema.js"></script>
</body>
</html>
