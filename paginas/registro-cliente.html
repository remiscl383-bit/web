<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de pasajero - RemisCL</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/tema-oscuro.css">
</head>
<body class="body-login">
  <main class="contenedor-login">
    <header class="header-login">
      <h1>Crear cuenta</h1>
      <p>Registrate como pasajero</p>
    </header>

    <form id="form-registro-cliente" class="form-login">
      <div class="campo-form">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" required>
      </div>

      <div class="campo-form">
        <label for="apellido">Apellido</label>
        <input id="apellido" name="apellido" type="text" required>
      </div>

      <div class="campo-form">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div class="campo-form">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" minlength="6" required>
      </div>

      <div class="campo-form">
        <label for="telefono">Número de teléfono</label>
        <input id="telefono" name="telefono" type="tel" value="+5493644" required>
      </div>

      <p id="mensaje-registro" class="mensaje-error" aria-live="polite"></p>
      <button type="submit" class="btn btn-principal">Registrarme</button>
    </form>

    <p class="footer-login"><a href="login-cliente.html">Ya tengo una cuenta</a></p>
  </main>

  <script type="module" src="../js/registro-cliente.js"></script>
  <script src="../js/tema.js"></script>
</body>
</html>
