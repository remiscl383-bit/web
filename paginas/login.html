<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Ingreso - RemisCL</title>
	<style>
		:root{--bg:#f6f8fb;--card:#ffffff;--accent:#0066cc;--muted:#6b7280}
		html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
		body{background:linear-gradient(180deg,#f3f6fb,white);display:flex;align-items:center;justify-content:center}
		.card{width:100%;max-width:420px;background:var(--card);border-radius:12px;box-shadow:0 6px 20px rgba(20,30,60,0.08);padding:28px}
		h1{font-size:20px;margin:0 0 6px;color:#0f172a}
		p.lead{margin:0 0 18px;color:var(--muted);font-size:14px}
		.form-group{margin-bottom:12px}
		label{display:block;font-size:13px;color:#111827;margin-bottom:6px}
		input[type="email"],input[type="password"],input[type="text"]{width:100%;padding:10px 12px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px}
		.row{display:flex;gap:8px}
		.btn{display:inline-block;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
		.btn-primary{background:var(--accent);color:white}
		.btn-secondary{background:#eef2ff;color:var(--accent)}
		#mensaje-error{color:#b91c1c;margin:6px 0 0;font-size:13px;min-height:18px}
		.footer{margin-top:14px;text-align:center;font-size:13px;color:var(--muted)}
	</style>
	<link rel="stylesheet" href="../css/tema-oscuro.css">
</head>
<body>
	<main class="card" role="main">
		<h1>RemisCL</h1>
		<p class="lead">Iniciá sesión para gestionar reservas, envíos y más.</p>

		<form id="form-login" onsubmit="return false">
			<div class="form-group">
				<label for="email">Email</label>
				<input id="email" type="email" placeholder="tu@correo.com" required>
			</div>

			<div class="form-group">
				<label for="password">Contraseña</label>
				<input id="password" type="password" placeholder="••••••••" required>
			</div>

			<p id="mensaje-error" aria-live="polite"></p>

			<div class="row" style="margin-top:12px">
				<button type="button" id="btn-login" class="btn btn-primary">Iniciar sesión</button>
				<button type="button" id="btn-register" class="btn btn-secondary">Registrarse</button>
			</div>
		</form>


		<div class="footer">¿Problemas para entrar? Contactá al administrador.</div>
	</main>

	<script type="module" src="../js/login.js"></script>
	<script src="../js/tema.js"></script>
</body>
</html>
