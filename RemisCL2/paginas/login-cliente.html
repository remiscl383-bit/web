<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de pasajero - RemisCL</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/tema-oscuro.css">
</head>
<body class="body-login">

  <main class="contenedor-login">
    <header class="header-login">
      <h2>RemisCL</h2>
      <p>Ingreso de pasajero</p>
    </header>

    <form id="form-login-cliente" class="form-login">
      <div class="campo-form">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@email.com" required>
      </div>

      <div class="campo-form">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div id="mensaje-error" class="mensaje-error"></div>

      <button type="submit" class="btn btn-principal">Iniciar sesión</button>
    </form>

    <footer class="footer-login">
      <p>¿No tenés cuenta? <a href="registro-cliente.html">Registrate</a></p>
    </footer>
  </main>

  <script type="module" src="../js/login-cliente.js"></script>
  <script src="../js/tema.js"></script>
</body>
</html>
