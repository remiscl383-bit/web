<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de chofer - RemisCL</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/tema-oscuro.css">
</head>
<body class="body-login">
  <main class="contenedor-login">
    <header class="header-login">
      <h1>Ingreso de chofer</h1>
      <p>Accedé a tu panel de RemisCL</p>
    </header>

    <form id="form-login-chofer" class="form-login">
      <div class="campo-form">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div class="campo-form">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required>
      </div>

      <p id="mensaje-error" class="mensaje-error" aria-live="polite"></p>
      <button type="submit" class="btn btn-principal">Iniciar sesión</button>
    </form>

    <p class="footer-login"><a href="registro-chofer.html">Solicitar incorporación</a></p>
  </main>

  <script type="module" src="../js/login-chofer.js"></script>
  <script src="../js/tema.js"></script>
</body>
</html>
